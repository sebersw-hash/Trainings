<html lang="cs">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Tréninky</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#172033;--ink2:#2b3550;--mute:#667289;--line:#e1e8f3;--blue:#4338ca;--on-blue:#fff;--blue-bg:#e4e2fb;--red:#c2321f;--green:#15803d;--orange:#a16207;--fill:#e8eef8;--ok-bg:#dcf5e7;--bad-bg:#fde4e1;--wait-bg:#fdf0d5;--shadow:0 2px 6px rgba(25,45,95,.18),0 8px 24px rgba(25,45,95,.14);--soft:0 1px 2px rgba(25,45,95,.05),0 6px 18px rgba(25,45,95,.06);--round:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",sans-serif;--hf:var(--round)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#171e2e;--ink:#e8edf7;--ink2:#e8edf7;--mute:#97a3bb;--line:#263049;--blue:#a5b4fc;--on-blue:#1e1b4b;--blue-bg:#2a2a58;--red:#ff8a78;--green:#6ee7a0;--orange:#fbbf24;--fill:#1f2739;--ok-bg:#16382a;--bad-bg:#4a2521;--wait-bg:#40351a;--shadow:0 2px 6px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.45);--soft:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(160px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}input,textarea{-webkit-user-select:text;user-select:text}
svg{display:block}
.top{display:flex;align-items:center;gap:8px;min-height:76px;margin:0 -16px;padding:8px 16px 4px;position:sticky;top:0;background:var(--bg);z-index:6}
.tt{flex:1;font-family:var(--hf);font-size:var(--hsz,28px);line-height:34px;font-weight:var(--hw,700);text-transform:var(--htx,none);letter-spacing:var(--hls,-.02em);color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{display:flex;align-items:center;gap:8px}
.ib{width:42px;height:42px;border-radius:var(--rt,14px);border:0;background:var(--card);box-shadow:var(--soft);outline:var(--cardb,0);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib:active,.ic:active{background:var(--fill)}
.ic{color:var(--blue);background:none;border:0;padding:8px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600}
.swr{display:flex;flex-wrap:wrap;gap:14px}
.sws{width:40px;height:40px;border-radius:50%;border:0;box-shadow:0 0 0 1px var(--line);padding:0}
.sws.sq{border-radius:12px}
.sws.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--blue)}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stb{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px;border:2px solid var(--line);border-radius:14px;background:var(--bg);font-weight:600;font-size:14px}
.stb.on{border-color:var(--blue)}
.stp{display:block;height:44px;border-radius:8px;margin-bottom:8px;position:relative;border:1px solid rgba(128,128,128,.25)}
.stp i{position:absolute;right:8px;bottom:8px;width:28px;height:14px;border-radius:4px}
.chipbtn{border:0;background:var(--card);box-shadow:var(--soft);outline:var(--cardb,0);color:var(--ink2);border-radius:var(--rt,14px);height:42px;padding:0 16px;font-size:14px;font-weight:600}
.sb{margin:-2px 2px 10px}
h2{font-size:12px;font-weight:700;color:var(--mute);margin:26px 6px 8px;text-transform:uppercase;letter-spacing:.08em}
.sub{color:var(--mute);font-size:13px}.nx{color:var(--blue);font-size:13px;font-weight:600}
.card{background:var(--card);border:var(--cardb,0);border-radius:var(--rc,20px);margin:12px 0;overflow:hidden;box-shadow:var(--soft)}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:16px}
.item:first-child{border-top:0}.item:active,.act:active{background:var(--fill)}
.rt{display:flex;justify-content:space-between;align-items:center;gap:12px}
.nm{font-size:16px;font-weight:var(--nmw,600);color:var(--ink);line-height:1.3}
.num{font-family:var(--hf);font-size:32px;font-weight:var(--hw,700);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.num.low{color:var(--red)}.num.big{font-size:52px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--ra,32%);color:#fff;font-family:var(--hf);font-weight:var(--hw,700);flex-shrink:0;letter-spacing:.02em}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;align-items:center}
.dots.ind,.sub.ind{margin-left:52px}
.dot{width:var(--dw,14px);height:var(--dh,6px);border-radius:var(--dr,3px);background:var(--c,var(--blue))}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:12px}.bar.ind{margin-left:52px}
.more{font-size:12px;color:var(--mute);font-weight:600}
.banner{display:block;width:100%;text-align:left;background:var(--blue-bg);border:0;border-radius:var(--rc,20px);padding:16px;margin:10px 0;color:var(--ink2)}
.act{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:15px 16px;color:var(--blue);font-size:15px;font-weight:600;text-decoration:none}
.act:first-child{border-top:0}.act.off{color:var(--mute)}.act.del{color:var(--red)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;min-height:54px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv>span:first-child{flex-shrink:0}
.kv input[type=text],.kv input[type=date],.kv input[type=time],.kv input[type=number],.kv select{background:none;border:0;text-align:right;font-size:15px;max-width:62%;min-width:0;color:var(--mute);padding:4px 0}
.kv input[type=text]{flex:1;width:auto}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 2px 0 var(--blue)}
textarea{background:none;border:0;text-align:right;font-size:15px;width:62%;min-height:60px;color:var(--mute);resize:none}
textarea.big{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--rt,14px);padding:12px;min-height:130px;color:var(--ink);font-size:13px}
.hist{display:flex;justify-content:space-between;gap:10px;padding:13px 16px;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}.pos{color:var(--green);font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--rch,8px);background:var(--fill);color:var(--mute)}
.chip.ok{background:var(--ok-bg);color:var(--green)}.chip.bad{background:var(--bad-bg);color:var(--red)}.chip.wait{background:var(--wait-bg);color:var(--orange)}
.empty{text-align:center;color:var(--mute);padding:48px 20px}
.hd{display:flex;align-items:center;gap:14px;margin:4px 0 8px}.hn{font-family:var(--hf);font-size:26px;line-height:32px;font-weight:var(--hw,700);text-transform:var(--htx,none);color:var(--ink);letter-spacing:-.01em}
.day{display:flex;gap:14px;padding:12px 0}
.day+.day{border-top:1px dashed var(--line)}
.dl{width:46px;text-align:center;flex-shrink:0}
.dw{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.dn{font-family:var(--hf);font-size:20px;font-weight:var(--hw,700);width:44px;height:44px;line-height:44px;border-radius:var(--rt,14px);margin:0 auto;color:var(--ink2);background:var(--card);box-shadow:var(--soft);outline:var(--cardb,0)}
.dn.today{background:var(--blue);color:var(--on-blue);box-shadow:none}
.evs{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.ev{border-radius:var(--re,14px);padding:10px 8px 10px 14px;color:var(--ink);background:var(--card);background:color-mix(in srgb,var(--c) 14%,var(--card));border-left:5px solid var(--c)}
.ev.past{opacity:.6}
.evr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.et{font-size:14px;font-weight:600;line-height:1.25}.es{font-size:12px;margin-top:2px;color:var(--mute)}
.evc{display:flex;align-items:center;gap:4px;flex-shrink:0}
.evt{font-size:11px;font-weight:600;background:var(--card);color:var(--mute);padding:2px 8px;border-radius:var(--rch,7px)}
.evx{background:none;border:0;color:var(--mute);padding:2px;display:inline-flex}.evx svg{width:18px;height:18px}
.tabs{position:fixed;left:var(--navx,12px);right:var(--navx,12px);bottom:calc(var(--navy,10px) + env(safe-area-inset-bottom));padding-bottom:var(--navpb,0px);max-width:var(--navmax,536px);margin:0 auto;background:var(--card);border-radius:var(--rn,24px);border-top:var(--navb,0);box-shadow:var(--shadow);z-index:8}
.tabs div{display:flex;padding:6px 4px}
.tabs button{flex:1;background:none;border:0;padding:6px 0 4px;color:var(--mute);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs .pl{position:relative;width:52px;height:30px;border-radius:var(--rpl,12px);display:flex;align-items:center;justify-content:center}
.tabs button.on{color:var(--blue)}.tabs button.on .pl{background:var(--blue-bg)}
.badge{position:absolute;top:-3px;right:4px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:16px;height:16px;line-height:16px;padding:0 4px;text-align:center}
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:7;display:flex;align-items:center;gap:8px;height:54px;padding:0 22px 0 16px;border:0;border-radius:var(--rb2,18px);background:var(--blue);color:var(--on-blue);font-size:15px;font-weight:700;text-transform:var(--tx,none);letter-spacing:var(--ls,0);box-shadow:var(--shadow)}
.ov{position:fixed;inset:0;background:rgba(10,16,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:var(--rs,28px) var(--rs,28px) 0 0;padding:8px 20px calc(28px + env(safe-area-inset-bottom))}
.sh::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sh h3{margin:0 0 8px;font-family:var(--hf);font-size:24px;font-weight:var(--hw,700);text-transform:var(--htx,none);letter-spacing:-.01em;color:var(--ink)}
.sh .card{background:var(--bg);box-shadow:none}
.sh .item,.sh .kv,.sh .act,.sh .hist{border-color:var(--line)}
.pri{display:block;width:100%;background:var(--blue);color:var(--on-blue);border:0;border-radius:var(--rb,16px);height:52px;font-weight:700;font-size:15px;margin-top:14px;text-transform:var(--tx,none);letter-spacing:var(--ls,0)}
.ghost{display:block;width:100%;background:none;border:0;color:var(--blue);padding:12px;margin-top:2px;font-weight:600;font-size:15px}
.err{color:var(--red);font-size:13px;margin:6px 4px;min-height:16px}
.warn{color:var(--orange);font-size:13px;padding:0 4px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:var(--rt,14px);font-size:14px;font-weight:500;z-index:30;box-shadow:var(--shadow);text-align:center}
.step{display:flex;align-items:center;gap:12px}
.step button{width:38px;height:38px;border-radius:var(--rt,12px);border:0;background:var(--fill);font-size:20px;line-height:1;color:var(--blue);font-weight:600}
.step span{min-width:32px;text-align:center;font-weight:700;font-family:var(--hf)}
.sw{width:52px;height:32px;border-radius:16px;background:var(--line);border:0;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--blue)}.sw.on::after{left:24px;background:var(--on-blue)}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--rt,12px);padding:11px;font-size:15px}
.lr{display:flex;gap:10px;align-items:flex-end;margin-top:8px}.lr label{flex:1;font-size:12px;color:var(--mute)}
.cb{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.cb:first-child{border-top:0}.cb input{width:20px;height:20px;accent-color:var(--blue)}
.disc{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 16px}
.disc:first-child{border-top:0}
.mailtxt{white-space:pre-wrap;font-size:14px;line-height:1.55;padding:14px 16px}
.invwrap{border-radius:var(--rt,14px);overflow:auto;margin:6px 0;border:1px solid var(--line)}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}html,body{background:#fff!important}}
</style>

    parts.slice(1).forEach(function(p){var j=p.indexOf('=');if(j>0)pr[p.slice(0,j).toUpperCase()]=p.slice(j+1).replace(/^"|"$/g,'')});
    if(name==='UID')cur.uid=val;

function toIban(acc){
  acc=String(acc||'').replace(/\s/g,'').toUpperCase();
  if(/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(acc))return acc;
  var m=acc.match(/^(?:(\d{1,6})-)?(\d{1,10})\/(\d{4})$/);
  if(!m)return '';
  var body=m[3]+('000000'+(m[1]||'0')).slice(-6)+('0000000000'+m[2]).slice(-10),rem=0;
  (body+'123500').split('').forEach(function(ch){rem=(rem*10+Number(ch))%97});
  return 'CZ'+('0'+(98-rem)).slice(-2)+body;
}
var billingReady=function(){var b=S.set.b;return !!(b.name&&toIban(b.account))};
function nextNumber(){var y=String(new Date().getFullYear()),max=0;S.invoices.forEach(function(i){if(i.number.indexOf(y)===0&&i.number.length===7)max=Math.max(max,+i.number.slice(4))});return y+('00'+(max+1)).slice(-3)}
function calc(lines,rate){var b=0;lines.forEach(function(l){l.total=Math.round(l.qty*l.price*100)/100;b+=l.total});b=Math.round(b*100)/100;var v=Math.round(b*rate)/100;return {base:b,vat:v,total:Math.round((b+v)*100)/100}}
function buildInvoice(c,raw){
  var b=S.set.b;
  if(!billingReady())throw new Error('Doplň fakturační údaje (jméno a číslo účtu) v Nastavení.');
  var lines=raw.map(function(l){return {desc:String(l.desc||'').trim(),qty:num(l.qty),price:num(l.price)}});
  if(!lines.length||lines.some(function(l){return !l.desc||!(l.qty>0)||!(l.price>=0)}))throw new Error('U každé položky vyplň popis, množství a cenu.');
  var rate=b.vat?21:0,t=calc(lines,rate),now=Date.now();
  return {number:nextNumber(),issued:now,due:now+b.dueDays*DAY,cid:c.id,email:c.email,name:c.name,greeting:c.greeting,customer:c.billing||'',lines:lines,vatRate:rate,base:t.base,vat:t.vat,total:t.total,status:'Vystaveno',sentAt:0,
    supplier:{name:b.name,address:b.address,ico:b.ico,dic:b.dic,account:b.account,iban:toIban(b.account),note:b.note,qr:b.qr}};
}
function qrSvg(inv){

}

  var d=el.dataset,c;
  switch(a){
    case 'tab':R.tab=d.t;R.client=null;break;
    case 'open':R.client=d.id;R.adj=0;R.note='';window.scrollTo(0,0);break;
    case 'back':R.client=null;break;
    case 'sync':
      if(S.set.cal.url){toast('Načítám kalendář…');gcSync(true).then(function(r){if(r)toast(r.n?'Zapsáno nových tréninků: '+r.n:'Kalendář načten, nic nového')});break}
      var n=runAll();toast(n?'Zapsáno nových tréninků: '+n:'Nic nového');break;
    case 'gcConnect':connectSheet();return;
    case 'gcCopy':
      var ta0=$('gcCode');ta0.removeAttribute('readonly');ta0.focus();ta0.select();ta0.setSelectionRange(0,99999);
      var done0=function(){toast('Kód zkopírován')};
      try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta0.value).then(done0,function(){document.execCommand('copy');done0()})}else{document.execCommand('copy');done0()}}catch(e){toast('Kód označ a zkopíruj ručně v poli níže')}
      ta0.setAttribute('readonly','');return;
    case 'gcDo':
      var url=$('gcUrl').value.trim();$('gcErr').textContent='';
      if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)){$('gcErr').textContent='Adresa musí začínat https://script.google.com/macros/…';return}
      $('gcErr').textContent='Zkouším spojení…';
      gcFetch(url,S.set.cal.token,Date.now()-120*DAY,Date.now()+60*DAY).then(function(){
        S.set.cal.url=url;S.set.cal.err='';save();closeSheet();toast('Připojeno, načítám tréninky…');
        return gcSync(true).then(function(r){if(r)toast('Načteno událostí: '+r.total+(r.n?', zapsáno tréninků: '+r.n:''));var f=gcFound();if(f.length)guestsSheet()});
      }).catch(function(e){var el=$('gcErr');if(el)el.textContent=e.message});return;
    case 'gcNow':toast('Načítám kalendář…');gcSync(true).then(function(r){if(r)toast(r.n?'Zapsáno nových tréninků: '+r.n:'Kalendář načten, nic nového')});return;
    case 'gcOff':
      if(!R.gcOff){R.gcOff=true;toast('Klepni znovu pro odpojení');setTimeout(function(){R.gcOff=false},4000);return}
      R.gcOff=false;S.set.cal.url='';S.set.cal.err='';S.events=S.events.filter(function(e){return e.src!=='google'});save();toast('Kalendář odpojen, zapsané tréninky zůstaly');break;
    case 'guests':guestsSheet();return;
    case 'ignoreGuest':S.set.cal.ignore.push(R.found[+d.i].email);save();guestsSheet();render();return;
    case 'style':S.set.theme.style=d.v;save();break;
    case 'accent':S.set.theme.accent=d.v;save();break;
    case 'bgcol':S.set.theme.bg=d.v;save();break;
    case 'today':var te=$('today');if(te)te.scrollIntoView({behavior:'smooth',block:'start'});return;
    case 'newClient':addSheet();return;
    case 'saveClient':
      var em=$('cEmail').value.trim().toLowerCase(),name=$('cName').value.trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){$('cErr').textContent='Neplatný e-mail.';return}
      if(S.clients.some(function(x){return x.email===em})){$('cErr').textContent='Klient s tímto e-mailem už existuje.';return}
      var from=$('cFrom').value?new Date($('cFrom').value+'T00:00').getTime():Date.now(),typ=$('cType').value,bought=Math.floor(num($('cBought').value));
      var nc={id:uid(),name:name||em,greeting:$('cGreet').value.trim(),email:em,type:typ,active:true,trackFrom:from,price:0,billing:'',log:[]};
      if(typ==='Balíček'&&bought>0)nc.log.push({date:Date.now(),delta:bought,kind:'Nákup',key:'',note:'Počáteční stav '+bought});
      S.clients.push(nc);closeSheet();var r=runAll();toast(r?'Klient přidán, zapsáno tréninků: '+r:'Klient přidán');break;
    case 'closeSheet':closeSheet();return;
    case 'logTraining':
      c=cl(R.client);c.log.push({date:Date.now(),delta:-1,kind:'Trénink',key:'manual_'+uid(),note:'Ručně zapsaný trénink'});mailAfter(c,Date.now());save();toast('Trénink zapsán');break;
    case 'sell':
      c=cl(R.client);var k=+d.n;c.log.push({date:Date.now(),delta:k,kind:'Nákup',key:'',note:'Balíček '+k});mailBuy(c,k);save();toast('Připsáno '+trainings(k)+'. E-mail čeká v záložce E-maily.');break;
    case 'bill':c=cl(R.client);var msg=bill(c);save();toast(msg);break;
    case 'adj':R.adj=Math.max(-50,Math.min(50,R.adj+(+d.d)));break;
    case 'adjSave':if(!R.adj)return;c=cl(R.client);c.log.push({date:Date.now(),delta:R.adj,kind:'Úprava',key:'',note:R.note||'Ruční úprava'});R.adj=0;R.note='';save();toast('Úprava uložena');break;
    case 'toggleActive':c=cl(R.client);c.active=!c.active;save();if(!c.active)R.client=null;break;
    case 'newEvent':eventSheet();return;
    case 'saveEvent':
      var date=$('evDate').value,time=$('evTime').value,dur=+$('evDur').value,rep=+$('evRep').value;
      var att=[].slice.call(document.querySelectorAll('#sheet input[name=att]:checked')).map(function(i){return i.value});
      if(!date||!time||!att.length){$('evErr').textContent='Vyber klienta, datum a čas.';return}
      var base=new Date(date+'T'+time);
      for(var w=0;w<rep;w++){var st=new Date(base.getFullYear(),base.getMonth(),base.getDate()+7*w,base.getHours(),base.getMinutes()).getTime();S.events.push({id:uid(),title:$('evTitle').value||'Trénink',start:st,end:st+dur*60000,attendees:att.slice(),src:'local'})}
      closeSheet();save();toast(rep>1?'Přidáno událostí: '+rep:'Událost přidána');break;
    case 'delEvent':S.events=S.events.filter(function(e){return e.id!==d.id});save();break;
    case 'icsImport':icsSheet();return;
    case 'pickGuest':var g=R.found[+d.i];addSheet({email:g.email,name:g.name});return;
    case 'mail':
      var ml=S.mails.find(function(x){return x.id===d.id});
      openSheet('<h3>'+esc(ml.subject)+'</h3><div class="sub" style="margin:0 4px 8px">Komu: '+esc(ml.to)+(ml.sent?' · odesláno '+dd(ml.sent):' · čeká')+'</div><div class="card"><div class="mailtxt">'+esc(ml.body)+'</div></div><div class="card"><button class="act" data-a="mailOpen" data-id="'+ml.id+'">Otevřít v Mailu a odeslat</button>'+(ml.sent?'<button class="act" data-a="mailUndo" data-id="'+ml.id+'">Vrátit mezi čekající</button>':'<button class="act" data-a="mailDone" data-id="'+ml.id+'">Označit jako odeslané</button>')+'<button class="act del" data-a="mailDel" data-id="'+ml.id+'">Smazat</button></div><button class="ghost" data-a="closeSheet">Zavřít</button>');return;
    case 'mailOpen':var m1=S.mails.find(function(x){return x.id===d.id});openMailto(m1.to,m1.subject,m1.body);m1.sent=Date.now();save();closeSheet();toast('Otevřeno v Mailu, potvrď odeslání tam');break;
    case 'mailDone':S.mails.find(function(x){return x.id===d.id}).sent=Date.now();save();closeSheet();break;
    case 'mailUndo':S.mails.find(function(x){return x.id===d.id}).sent=0;save();closeSheet();break;
    case 'mailDel':S.mails=S.mails.filter(function(x){return x.id!==d.id});save();closeSheet();break;
    case 'invNew':R.draft=draftFor(cl(R.client));invSheet();return;
    case 'invAdd':R.draft.lines.push({desc:'',qty:1,price:R.draft.lines[0]?R.draft.lines[0].price:0});invSheet();return;
    case 'invDel':R.draft.lines.splice(+d.i,1);invSheet();return;
    case 'invPreview':
      try{var pv=buildInvoice(cl(R.draft.cid),R.draft.lines);openSheet('<h3>Náhled faktury</h3><div class="invwrap">'+invoiceFragment(pv)+'</div><button class="pri" data-a="invBack">Zpět k úpravě</button>')}catch(e){$('invErr').textContent=e.message}return;
    case 'invBack':invSheet();return;
    case 'invIssue':
      try{var inv=buildInvoice(cl(R.draft.cid),R.draft.lines);S.invoices.push(inv);save();closeSheet();toast('Faktura '+inv.number+' vystavena ('+money(inv.total)+')');invOpen(inv.number)}catch(e){$('invErr').textContent=e.message;return}
      break;
    case 'invOpen':invOpen(d.n);return;
    case 'invPrint':var iv=S.invoices.find(function(i){return i.number===d.n});$('print').innerHTML=invoiceFragment(iv);setTimeout(function(){window.print()},50);return;
    case 'invShare':
      var iv2=S.invoices.find(function(i){return i.number===d.n}),html='<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faktura '+iv2.number+'</title></head><body style="margin:0;background:#fff">'+invoiceFragment(iv2)+'</body></html>';
      try{var f=new File([html],'Faktura-'+iv2.number+'.html',{type:'text/html'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}}catch(e){}
      toast('Sdílení souboru zde není dostupné. Použij tisk do PDF.');return;
    case 'invMail':
      var iv3=S.invoices.find(function(i){return i.number===d.n});openMailto(iv3.email,'Faktura č. '+iv3.number,invoiceBody(iv3));
      if(iv3.status==='Vystaveno')iv3.status='Odesláno';iv3.sentAt=Date.now();save();closeSheet();toast('Otevřeno v Mailu, potvrď odeslání tam');break;
    case 'invPaid':
      var iv4=S.invoices.find(function(i){return i.number===d.n});iv4.status=d.p==='1'?'Zaplaceno':(iv4.sentAt?'Odesláno':'Vystaveno');save();closeSheet();toast(d.p==='1'?'Označeno jako zaplacené':'Vráceno mezi nezaplacené');break;
    case 'billSet':R.bs=JSON.parse(JSON.stringify(S.set.b));billSheet();return;
    case 'bvat':el.classList.toggle('on');R.bs.vat=el.classList.contains('on');return;
    case 'bqr':el.classList.toggle('on');R.bs.qr=el.classList.contains('on');return;
    case 'billSave':
      var acc=$('bAcc').value.trim();
      if(acc&&!toIban(acc)){$('bErr').textContent='Číslo účtu nepoznávám. Zadej 123456789/0800 nebo IBAN.';return}
      S.set.b={name:$('bName').value.trim(),address:$('bAddr').value.trim(),ico:$('bIco').value.trim(),dic:$('bDic').value.trim(),account:acc,vat:R.bs.vat,qr:R.bs.qr,dueDays:Math.max(1,Math.min(90,Math.floor(num($('bDue').value))||14)),price:Math.max(0,num($('bPrice').value)),note:$('bNote').value.trim()};
      save();closeSheet();toast('Fakturační údaje uloženy');break;
    case 'backup':backup();return;
    case 'copyBackup':
      var ta=$('bk');ta.select();try{navigator.clipboard?navigator.clipboard.writeText(ta.value):document.execCommand('copy');toast('Zkopírováno')}catch(e){document.execCommand('copy');toast('Zkopírováno')}return;
    case 'restore':restoreSheet();return;
    case 'doRestore':
      try{var j=JSON.parse($('bkText').value);if(!j||!Array.isArray(j.clients))throw 0;S=j;ensureCal();S.events=S.events||[];S.mails=S.mails||[];S.invoices=S.invoices||[];save();closeSheet();R={tab:'clients',client:null,adj:0,note:'',draft:null,bs:null};toast('Data obnovena')}
      catch(e){$('bkErr').textContent='Tohle není platná záloha.';return}
      break;
    case 'sample':sampleData();runAll();toast('Ukázková data načtena');break;
    case 'wipe':
      if(!R.wipe){R.wipe=true;toast('Klepni znovu pro smazání všech dat');setTimeout(function(){R.wipe=false},4000);return}
      R.wipe=false;S=blank();save();R.client=null;toast('Vše smazáno');break;
  }
  render();
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el)return;if(el.classList.contains('ov')&&e.target!==el)return;act(el.dataset.a,el)});
document.addEventListener('input',function(e){var t=e.target;if(t.id==='adjNote')R.note=t.value;if(t.dataset&&t.dataset.l!==undefined&&R.draft){R.draft.lines[+t.dataset.l][t.dataset.k]=t.value;updateTotal()}});
document.addEventListener('change',function(e){
  var f=e.target.dataset.f;if(!f)return;var v=e.target.value;
  if(f==='trainer'){S.set.trainer=v;save();return}
  var c=cl(R.client);if(!c)return;
  if(f==='name')c.name=v||c.name;
  else if(f==='greeting')c.greeting=v.trim();
  else if(f==='email'){var em=v.trim().toLowerCase();if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)&&!S.clients.some(function(x){return x!==c&&x.email===em}))c.email=em;else toast('E-mail je neplatný nebo už existuje.')}
  else if(f==='type')c.type=v;
  else if(f==='trackFrom'){if(v)c.trackFrom=new Date(v+'T00:00').getTime()}
  else if(f==='price')c.price=num(v);
  else if(f==='billing')c.billing=v;
  save();render();
});
document.addEventListener('visibilitychange',function(){if(!document.hidden){runAll();render();gcSync(false)}});
setInterval(function(){if(document.hidden||$('sheet').innerHTML)return;if(S.set.cal.url){gcSync(false)}else{var n=runAll();if(n)render()}},300000);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
runAll();render();gcSync(false);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  var hadCtl=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadCtl&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
</body>
</html>
