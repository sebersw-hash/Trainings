(function(){

function fix(j){
  if(!j||typeof j!=='object')j={};
  ['clients','events','mails','invoices','sms'].forEach(function(k){if(!Array.isArray(j[k]))j[k]=[]});
  j.clients=j.clients.filter(function(c){return c&&typeof c==='object'});
  j.clients.forEach(function(c){if(!Array.isArray(c.log))c.log=[];c.log=c.log.filter(function(e){return e&&typeof e==='object'})});
  j.events=j.events.filter(function(e){return e&&Array.isArray(e.attendees)});
  j.mails=j.mails.filter(function(m){return m&&typeof m==='object'});
  j.invoices=j.invoices.filter(function(m){return m&&typeof m==='object'});
  if(!j.set||typeof j.set!=='object')j.set={};

  h.innerHTML='<div style="padding:22px;font-family:-apple-system,system-ui,sans-serif;color:#111;max-width:520px;margin:0 auto"><h2 style="margin:8px 0">Aplikaci se nepodařilo spustit</h2><p style="line-height:1.5;color:#444">Tvoje data jsou pravděpodobně v pořádku, jen se při startu něco pokazilo. Zkus postupně:</p>'+
   '<button id="crR" style="'+b+'background:#4338ca;color:#fff">Zkusit znovu</button><button id="crF" style="'+b+'background:#e5e7eb;color:#111">Opravit data a spustit</button><button id="crD" style="'+b+'background:#e5e7eb;color:#111">Zobrazit data k uložení</button><button id="crX" style="'+b+'background:#fee2e2;color:#b91c1c">Smazat data a začít znovu</button>'+
   '<textarea id="crT" readonly style="display:none;width:100%;height:170px;margin-top:8px;font:11px ui-monospace,Menlo,monospace"></textarea><p style="color:#888;font-size:12px;word-break:break-word">'+E(msg)+'</p></div>';
  document.getElementById('crR').onclick=function(){location.reload()};
  document.getElementById('crD').onclick=function(){var t=document.getElementById('crT');t.style.display='block';t.value=raw()||'(žádná data)';t.focus();t.select()};
  document.getElementById('crF').onclick=function(){try{var r=raw();if(!r){location.reload();return}localStorage.setItem(MAIN+'.pred-opravou',r);localStorage.setItem(MAIN,JSON.stringify(fix(JSON.parse(r))));location.reload()}catch(e){alert('Data se nepodařilo opravit. Použij Zobrazit data k uložení a zkopíruj je.')}};
  document.getElementById('crX').onclick=function(){if(confirm('Opravdu smazat všechna data v aplikaci? Nejdřív použij Zobrazit data k uložení a zkopíruj je do Poznámek.')&&confirm('Poslední potvrzení: data se nenávratně smažou.')){try{var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('treninky')===0)ks.push(k)}ks.forEach(function(k){localStorage.removeItem(k)})}catch(e){}location.reload()}};
};
window.addEventListener('error',function(e){window.__crash((e.message||'Chyba')+(e.lineno?' (řádek '+e.lineno+')':''))});
window.addEventListener('unhandledrejection',function(e){if(!window.__ready)window.__crash(String((e.reason&&e.reason.message)||e.reason||'Chyba'))});

/* Trénink, který byl zrušen nebo odmítnut (klientem i trenérem), se nepočítá: kredit se vrátí a čekající e-mail se smaže. */
function revokeTraining(c,x,why){
  var i=c.log.indexOf(x);if(i<0)return false;
  c.log.splice(i,1);
  c.log.push({date:x.date,delta:0,kind:'Úprava',key:'rev_'+x.key,note:'Nezapočítáno ('+why+'): '+(x.note||'trénink')});
  var subj='Trénink zapsán ('+dd(x.date)+')';
  /* smaže se jen jeden čekající e-mail (v týž den může být tréninků víc) */
  var tid='t:'+x.key+'|'+c.email,rm=false;
  for(var k=0;k<S.mails.length;k++){if(S.mails[k].id===tid&&!S.mails[k].sent){S.mails.splice(k,1);rm=true;break}}
  if(!rm)for(var k2=0;k2<S.mails.length;k2++){var m=S.mails[k2];if(m.to===c.email&&!m.sent&&m.subject===subj){S.mails.splice(k2,1);break}}
  return true;
}
/* Zapsané tréninky, které už nejsou v propojeném kalendáři (pravděpodobně zrušené nebo odmítnuté). */
function calReady(){var g=S.set.cal;return !!(g.url&&g.last&&!g.err)}
function orphansOf(c){
  if(!calReady())return [];
  var now=Date.now(),from=Math.max(now-120*DAY,c.trackFrom),evs=S.events.filter(function(e){return !e.cancelled&&e.attendees.indexOf(c.email)>=0});
  return c.log.filter(function(x){
    if(x.kind!=='Trénink'||x.keep||String(x.key).indexOf('manual_')===0)return false;
    if(x.date<from||x.date>now)return false;
    return !evs.some(function(e){return Math.abs(e.start-x.date)<=300000});
  });
}
function orphansAll(){var out=[];S.clients.forEach(function(c){orphansOf(c).forEach(function(x){out.push({c:c,x:x})})});return out}
/* Stačí, aby událost odmítl nebo zrušil kdokoli (trenér i kterýkoli klient): trénink neproběhl pro všechny. */
function revokeByCancelled(list){
  var n=0;
  S.clients.forEach(function(c){
    c.log.filter(function(x){return x.kind==='Trénink'&&String(x.key).indexOf('manual_')!==0}).forEach(function(x){
      for(var i=0;i<list.length;i++){
        var ev=list[i];
        if(ev.attendees.indexOf(c.email)>=0&&(x.key===ev.id||Math.abs(ev.start-x.date)<=300000)){if(revokeTraining(c,x,ev.why||'zrušeno'))n++;break}
      }
    });
  });
  return n;
}
/* Ruční zrušení: událost se označí jako zrušená (nikomu se nezapočítá), pamatuje se i po dalším načtení kalendáře. */
function cancelEvent(id,why){
  var ev=S.events.filter(function(e){return e.id===id})[0];if(!ev)return 0;
  why=why||'zrušeno ručně';S.set.mc[id]={why:why,at:Date.now()};ev.cancelled=true;ev.why=why;
  return revokeByCancelled([ev]);
}
function restoreEvent(id){
  delete S.set.mc[id];
  var ev=S.events.filter(function(e){return e.id===id})[0];if(ev){ev.cancelled=false;delete ev.why}
}
function eventOf(c,x){

}
/* ---------- SMS: upozornění na vyčerpaný balíček ---------- */
function phoneNorm(p){p=String(p||'').replace(/[\s\-().]/g,'');if(/^00/.test(p))p='+'+p.slice(2);if(/^\d{9}$/.test(p))p='+420'+p;return p}
function tplFill(t,c){return String(t).replace(/\{ahoj\}/g,hello(c)).replace(/\{jméno\}/g,String(c.name).split(' ')[0]).replace(/\{podpis\}/g,S.set.trainer||'')}
function smsText(c,tpl){return tplFill(tpl||(S.set.sms&&S.set.sms.text)||SMS_DEF,c).replace(/\s+/g,' ').trim()}
function outMailBody(c){return tplFill((S.set.notify&&S.set.notify.emailText)||EMAIL_OUT_DEF,c).replace(/[ \t]+\n/g,'\n').trim()}
/* Kanál upozornění při vyčerpání balíčku: výchozí z Nastavení, nebo vlastní u klienta (email, sms, both, none). */
function outChannel(c){var v=c.notify;if(!v||v==='default')v=(S.set.notify&&S.set.notify.out)||'sms';return v}
function outEmail(c){var v=outChannel(c);return v==='email'||v==='both'}

function openSms(num,text){

/* Při přechodu balíčku z kladného zůstatku na 0 se připraví SMS (jen u balíčkových klientů). */
function smsCheck(){
  if(!S.sms)S.sms=[];
  S.clients.forEach(function(c){
    if(!c.active||c.type==='Měsíční')return;
    var b=bal(c);
    if(b>0){
      c.smsArm=true;
      S.sms=S.sms.filter(function(m){return !(m.cid===c.id&&!m.sent)});
      S.mails=S.mails.filter(function(m){return !(m.to===c.email&&!m.sent&&m.subject==='Balíček je vyčerpaný')});
      return;
    }
    if(c.smsArm){
      c.smsArm=false;
      var parts=[];
      var lastT=c.log.filter(function(e){return e.kind==='Trénink'}).sort(function(a,b){return b.date-a.date})[0],tag=c.id+'|'+(lastT?lastT.key:'');
      if(outSms(c)){var sid='x:'+tag;if(!S.sms.some(function(m){return m.id===sid})){S.sms.unshift({id:sid,cid:c.id,text:smsText(c),created:Date.now(),sent:0})}parts.push('SMS')}
      if(outEmail(c)){enqueue(c.email,'Balíček je vyčerpaný',outMailBody(c),'ox:'+tag);parts.push('e-mail')}
      if(parts.length)toast('Upozornění pro '+c.name+' čeká ('+parts.join(' a ')+'): balíček je vyčerpaný.');
    }
  });
}

function isPaid(e){return e.pd!==false}
function payEntries(c){return c.log.filter(function(e){return (e.kind==='Nákup'||e.kind==='Měsíční platba')&&e.delta>0})}
function unpaidOf(c){return payEntries(c).filter(function(e){return !isPaid(e)})}
function entryAmount(c,e){var pr=c.price||(S.set.b&&S.set.b.price)||0;return e.delta*pr}
function unpaidClients(){return S.clients.filter(function(c){return c.active&&unpaidOf(c).length})}
function unpaidTotal(){var t=0;unpaidClients().forEach(function(c){unpaidOf(c).forEach(function(e){t+=entryAmount(c,e)})});return t}
function payChip(c){return unpaidOf(c).length?' <span class="chip bad" style="font-size:11px;vertical-align:middle">Nezaplaceno</span>':''}
function sync(){
  var t=Date.now(),n=0,from=t-120*DAY,done={};
  S.clients.forEach(function(c){c.log.forEach(function(e){if(e.kind==='Trénink')done[e.key+'|'+c.email]=1})});
  S.events.slice().sort(function(a,b){return a.start-b.start}).forEach(function(ev){
    if(S.set.mc[ev.id]&&!ev.cancelled){ev.cancelled=true;ev.why=S.set.mc[ev.id].why}
    if(ev.cancelled||ev.end>t||ev.start<from)return;
    ev.attendees.forEach(function(em){
      var c=S.clients.find(function(x){return x.email===em&&x.active});
      if(!c||ev.start<c.trackFrom)return;
      var key=ev.id;if(done[key+'|'+em])return;
      var dupe=c.log.filter(function(x){return x.kind==='Trénink'&&Math.abs(x.date-ev.start)<60000})[0];
      if(dupe){if(String(dupe.key).indexOf('manual_')!==0&&String(dupe.key).indexOf('g_')!==0&&key.indexOf('g_')===0)dupe.key=key;return}
      c.log.push({date:ev.start,delta:-1,kind:'Trénink',key:key,note:ev.title});done[key+'|'+em]=1;n++;
      if(t-ev.end<3*DAY)mailAfter(c,ev.start,key);
    });
  });
  return n;
}
/* ---------- měsíce: převod nedodělaných tréninků do dalšího měsíce ---------- */
function mStart(ms){var d=new Date(ms);return new Date(d.getFullYear(),d.getMonth(),1).getTime()}
function mAdd(ms,k){var d=new Date(ms);return new Date(d.getFullYear(),d.getMonth()+k,1).getTime()}
function mLabel(ms){var d=new Date(ms),n=MONTHS[d.getMonth()];return n.charAt(0).toUpperCase()+n.slice(1)+' '+d.getFullYear()}
/* Do kterého měsíce záznam patří: měsíční platba podle poznámky, ostatní podle data. */
function effMonth(e){
  if(e.kind==='Měsíční platba'){var m=/^Měsíc (\d{4})-(\d{2})$/.exec(e.note||'');if(m)return new Date(+m[1],+m[2]-1,1).getTime()}
  return mStart(e.date);
}
function monthEvents(c,M){
  var E=mAdd(M,1),from=Math.max(M,c.trackFrom);
  return S.events.filter(function(e){return !e.cancelled&&e.start>=from&&e.start<E&&e.attendees.indexOf(c.email)>=0}).sort(function(a,b){return a.start-b.start});
}
function monthCancelled(c,M){
  var E=mAdd(M,1),from=Math.max(M,c.trackFrom);
  return S.events.filter(function(e){return e.cancelled&&e.start>=from&&e.start<E&&e.attendees.indexOf(c.email)>=0}).sort(function(a,b){return a.start-b.start});
}
function cancelledOf(c){var now=Date.now();return S.events.filter(function(e){return e.cancelled&&e.attendees.indexOf(c.email)>=0&&e.start>=Math.max(now-120*DAY,c.trackFrom)}).sort(function(a,b){return b.start-a.start})}
function cancelledSection(c){
  var l=cancelledOf(c);if(!l.length)return '';
  return '<h2>Zrušené tréninky</h2><div class="card">'+l.map(function(e){return '<div class="hist"><div><div style="text-decoration:line-through">'+esc(e.title)+'</div><div class="sub">'+when(e.start)+' · '+esc(e.why||'zrušeno')+'</div></div><span style="display:flex;align-items:center;gap:4px"><span class="chip bad">Zrušeno</span><button class="ic" style="font-size:13px;padding:4px 6px" data-a="evOpen" data-id="'+esc(e.id)+'">Detail</button></span></div>'}).join('')+'</div>';
}
function monthStatsFor(c,M,carryOverride){
  var E=mAdd(M,1),cur=mStart(Date.now()),carryIn=0,paid=0,other=0,done=0,keys={};
  c.log.forEach(function(e){
    if(e.kind==='Trénink')keys[e.key]=1;
    var em=effMonth(e);
    if(em<M)carryIn+=e.delta;
    else if(em<E){if(e.kind==='Měsíční platba')paid+=e.delta;else if(e.kind==='Trénink')done++;else other+=e.delta}
  });
  if(carryOverride!==undefined&&carryOverride!==null)carryIn=carryOverride;
  var evs=monthEvents(c,M),unlogged=evs.filter(function(e){return !keys[e.id]}).length,closing=carryIn+paid+other-done;
  var billed=c.log.some(function(e){return e.kind==='Měsíční platba'&&e.note==='Měsíc '+ym(M)});
  /* due = kolik tréninků je k úhradě, proj = kolik se přenese do dalšího měsíce, až proběhnou všechny naplánované
     tréninky (u dosud nevyúčtovaného současného nebo budoucího měsíce se počítá, že se zaplatí due) */
  var due=Math.max(0,evs.length-Math.max(0,carryIn+other)),assumed=(!billed&&M>=cur)?due:0;
  return {M:M,canc:monthCancelled(c,M),carryIn:carryIn,paid:paid,other:other,done:done,planned:evs.length,unlogged:unlogged,evs:evs,billed:billed,closing:closing,due:due,proj:M<cur?closing:closing+assumed-Math.max(0,evs.length-done),keys:keys};
}
function monthStats(c,M){
  var cur=mStart(Date.now());
  if(M<=cur)return monthStatsFor(c,M,null);
  var st=monthStatsFor(c,cur,null),m=cur;
  while(m<M){m=mAdd(m,1);st=monthStatsFor(c,m,st.proj)}
  return st;
}
/* K úhradě = tréninky v měsíci minus už zaplacený převod z minulosti. */
function monthDue(st){return st.due}
function bill(c,M){
  M=M||mStart(Date.now());
  var marker='Měsíc '+ym(M);
  if(c.log.some(function(e){return e.kind==='Měsíční platba'&&e.note===marker}))return mLabel(M)+' už je vyúčtovaný.';
  var st=monthStats(c,M),avail=Math.max(0,st.carryIn+st.other),toPay=monthDue(st);
  c.log.push({date:Date.now(),delta:toPay,kind:'Měsíční platba',key:'',note:marker,pd:toPay===0});
  mailMonthly(c,new Date(M),st.planned,avail,toPay);
  return mLabel(M)+': '+trainings(st.planned)+', k úhradě '+trainings(toPay)+'.';
}
function runAll(){
  var n=sync();
  S.clients.forEach(function(c){if(c.active&&c.type==='Měsíční')bill(c)});
  save();return n;

    if(!cur)return;

    else if(name==='DTSTART'){var a=parseDt(val);if(a){cur.start=a.ms;cur.allday=a.allday}}

function toIban(acc){
  acc=String(acc||'').replace(/\s/g,'').toUpperCase();
  if(/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(acc))return acc;
  var m=acc.match(/^(?:(\d{1,6})-)?(\d{1,10})\/(\d{4})$/);
  if(!m)return '';
  var body=m[3]+('000000'+(m[1]||'0')).slice(-6)+('0000000000'+m[2]).slice(-10),rem=0;
  (body+'123500').split('').forEach(function(ch){rem=(rem*10+Number(ch))%97});
  return 'CZ'+('0'+(98-rem)).slice(-2)+body;
}
var billingReady=function(){var b=S.set.b;return !!(b.name&&toIban(b.account))};
function invByKey(k){return S.invoices.filter(function(i){return (i.key||i.number)===k})[0]}
function nextNumber(){var y=String(new Date().getFullYear()),max=0;S.invoices.forEach(function(i){if(i.src!=='idoklad'&&i.number.indexOf(y)===0&&i.number.length===7)max=Math.max(max,+i.number.slice(4))});return y+('00'+(max+1)).slice(-3)}
function calc(lines,rate){var b=0;lines.forEach(function(l){l.total=Math.round(l.qty*l.price*100)/100;b+=l.total});b=Math.round(b*100)/100;var v=Math.round(b*rate)/100;return {base:b,vat:v,total:Math.round((b+v)*100)/100}}
function buildInvoice(c,raw){
  var b=S.set.b;
  if(!billingReady())throw new Error('Doplň fakturační údaje (jméno a číslo účtu) v Nastavení.');
  var lines=raw.map(function(l){return {desc:String(l.desc||'').trim(),qty:num(l.qty),price:num(l.price)}});
  if(!lines.length||lines.some(function(l){return !l.desc||!(l.qty>0)||!(l.price>=0)}))throw new Error('U každé položky vyplň popis, množství a cenu.');
  var rate=b.vat?21:0,t=calc(lines,rate),now=Date.now();
  return {number:nextNumber(),issued:now,due:now+b.dueDays*DAY,cid:c.id,email:c.email,name:c.name,greeting:c.greeting,customer:c.billing||'',lines:lines,vatRate:rate,base:t.base,vat:t.vat,total:t.total,status:'Vystaveno',sentAt:0,
    supplier:{name:b.name,address:b.address,ico:b.ico,dic:b.dic,account:b.account,iban:toIban(b.account),note:b.note,qr:b.qr}};
}
function qrSvg(inv){
  var s=inv.supplier;if(!s.qr||!s.iban||!(inv.total>0))return '';
  try{
    var q=qrcode(0,'M');q.addData('SPD*1.0*ACC:'+s.iban+'*AM:'+inv.total.toFixed(2)+'*CC:CZK*X-VS:'+inv.number+'*MSG:FAKTURA '+inv.number);q.make();
    return q.createSvgTag(4,0).replace(/width="\d+px" height="\d+px"/,'width="110" height="110"');
  }catch(e){return ''}
}

  (s.note?'<p class="mute" style="margin-top:26px">'+nl(s.note)+'</p>':'')+'</div>';
}

function calView(){
  var t=Date.now(),from=t-7*DAY,to=t+30*DAY,nd=new Date(t);
  var evs=S.events.filter(function(e){return e.start>=from&&e.start<=to}).sort(function(a,b){return a.start-b.start});
  var logged={};S.clients.forEach(function(c){c.log.forEach(function(e){if(e.kind==='Trénink')logged[e.key]=1})});
  var mn=MONTHS[nd.getMonth()];
  var h=bar(mn.charAt(0).toUpperCase()+mn.slice(1)+' '+nd.getFullYear(),'','<button class="chipbtn" data-a="today">Dnes</button>'+ibtn('icsImport',IC.up,'Importovat .ics'));
  if(!evs.length)return h+'<div class="empty">V nejbližších dnech nic není.<br>Přidej událost nebo importuj kalendář.</div>';
  var cur='',open=false;
  evs.forEach(function(e){
    var key=iso(e.start),d=new Date(e.start);
    if(key!==cur){
      if(open)h+='</div></div>';
      cur=key;var isT=key===iso(t);
      h+='<div class="day"'+(isT?' id="today"':'')+'><div class="dl"><div class="dw">'+WD[d.getDay()]+'</div><div class="dn'+(isT?' today':'')+'">'+d.getDate()+'</div></div><div class="evs">';open=true;
    }
    var first=null;
    e.attendees.forEach(function(em){if(!first){var c=S.clients.find(function(x){return x.email===em});if(c)first=c}});
    var names=e.attendees.map(function(em){var c=S.clients.find(function(x){return x.email===em});return c?c.name:em}).join(', ');
    var past=e.end<=t,isL=logged[e.id];
    var tag=e.cancelled?'<span class="evt" style="background:var(--bad-bg);color:var(--red)">Zrušeno</span>':(!past?'':(isL?'<span class="evt">Zapsáno</span>':'<span class="evt">Bez klienta</span>'));
    h+='<div class="ev'+(past||e.cancelled?' past':'')+'" data-a="evOpen" data-id="'+esc(e.id)+'" style="cursor:pointer;--c:'+(first?clr(first.email):'#64748b')+'"><div class="evr"><div style="min-width:0"><div class="et"'+(e.cancelled?' style="text-decoration:line-through"':'')+'>'+esc(e.title)+'</div><div class="es">'+tt(e.start)+' – '+tt(e.end)+' · '+esc(names)+(e.cancelled&&e.why?' · '+esc(e.why):'')+'</div></div><div class="evc">'+tag+'<button class="evx" data-a="delEvent" data-id="'+esc(e.id)+'" aria-label="Smazat událost">'+IC.x+'</button></div></div></div>';
  });
  return h+(open?'</div></div>':'');
}

  }else{
    h+='<div class="sub" style="margin:0 4px 8px">Načteno událostí: '+res.total+', nových: '+res.added+'. Zapsáno tréninků: '+res.recorded+'.'+(res.revoked?' Zrušených nebo odmítnutých událostí: '+(res.cancelled||0)+', odebráno tréninků: '+res.revoked+'.':'')+'</div>';
    if(res.found.length){h+='<h2>Hosté, kteří ještě nejsou klienti</h2><div class="card">'+res.found.map(function(g,i){return '<button class="disc" data-a="pickGuest" data-i="'+i+'"><div>'+esc(g.name||g.email)+'</div><div class="sub">'+esc(g.email)+' · '+g.count+' událostí · klepni pro přidání</div></button>'}).join('')+'</div>';R.found=res.found}
    h+='<button class="ghost" data-a="closeSheet">Hotovo</button>';
  }
  openSheet(h);
  var f=$('icsFile');
  if(f)f.onchange=function(){
    var files=[].slice.call(f.files||[]);if(!files.length)return;
    Promise.all(files.map(function(x){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsText(x)})})).then(function(texts){

}

    case 'back':R.client=null;break;

      var n=runAll();toast(n?'Zapsáno nových tréninků: '+n:'Nic nového');break;

      var done0=function(){toast('Kód zkopírován')};
      try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta0.value).then(done0,function(){document.execCommand('copy');done0()})}else{document.execCommand('copy');done0()}}catch(e){toast('Kód označ a zkopíruj ručně v poli níže')}

    case 'mail':
      var ml=S.mails.find(function(x){return x.id===d.id});
      openSheet('<h3>'+esc(ml.subject)+'</h3><div class="sub" style="margin:0 4px 8px">Komu: '+esc(ml.to)+(ml.sent?' · odesláno '+dd(ml.sent):' · čeká')+'</div><div class="card"><div class="mailtxt">'+esc(ml.body)+'</div></div><div class="card"><button class="act" data-a="mailOpen" data-id="'+ml.id+'">Otevřít v Mailu a odeslat</button>'+(ml.sent?'<button class="act" data-a="mailUndo" data-id="'+ml.id+'">Vrátit mezi čekající</button>':'<button class="act" data-a="mailDone" data-id="'+ml.id+'">Označit jako odeslané</button>')+'<button class="act del" data-a="mailDel" data-id="'+ml.id+'">Smazat</button></div><button class="ghost" data-a="closeSheet">Zavřít</button>');return;
    case 'mailOpen':var m1=S.mails.find(function(x){return x.id===d.id});openMailto(m1.to,m1.subject,m1.body);m1.sent=Date.now();save();closeSheet();toast('Otevřeno v Mailu, potvrď odeslání tam');break;
    case 'mailDone':S.mails.find(function(x){return x.id===d.id}).sent=Date.now();save();closeSheet();break;
    case 'mailUndo':S.mails.find(function(x){return x.id===d.id}).sent=0;save();closeSheet();break;
    case 'mailDel':S.mails=S.mails.filter(function(x){return x.id!==d.id});save();closeSheet();break;
    case 'invNew':R.draft=draftFor(cl(R.client));invSheet();return;
    case 'invAdd':R.draft.lines.push({desc:'',qty:1,price:R.draft.lines[0]?R.draft.lines[0].price:0});invSheet();return;
    case 'invDel':R.draft.lines.splice(+d.i,1);invSheet();return;
    case 'invPreview':
      try{var pv=buildInvoice(cl(R.draft.cid),R.draft.lines);openSheet('<h3>Náhled faktury</h3><div class="invwrap">'+invoiceFragment(pv)+'</div><button class="pri" data-a="invBack">Zpět k úpravě</button>')}catch(e){$('invErr').textContent=e.message}return;
    case 'invBack':invSheet();return;
    case 'invIssue':
      try{var inv=buildInvoice(cl(R.draft.cid),R.draft.lines);S.invoices.push(inv);save();closeSheet();toast('Faktura '+inv.number+' vystavena ('+money(inv.total)+')');invOpen(inv.number)}catch(e){$('invErr').textContent=e.message;return}
      break;
    case 'invOpen':invOpen(d.n);return;
    case 'invPrint':var iv=invByKey(d.n);$('print').innerHTML=invoiceFragment(iv);setTimeout(function(){window.print()},50);return;
    case 'invShare':
      var iv2=invByKey(d.n),html='<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faktura '+iv2.number+'</title></head><body style="margin:0;background:#fff">'+invoiceFragment(iv2)+'</body></html>';
      try{var f=new File([html],'Faktura-'+iv2.number+'.html',{type:'text/html'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}}catch(e){}
      toast('Sdílení souboru zde není dostupné. Použij tisk do PDF.');return;
    case 'invMail':
      var iv3=invByKey(d.n);openMailto(iv3.email,'Faktura č. '+iv3.number,invoiceBody(iv3));
      if(iv3.status==='Vystaveno')iv3.status='Odesláno';iv3.sentAt=Date.now();save();closeSheet();toast('Otevřeno v Mailu, potvrď odeslání tam');break;
    case 'invPaid':
      var iv4=invByKey(d.n);iv4.status=d.p==='1'?'Zaplaceno':(iv4.sentAt?'Odesláno':'Vystaveno');save();closeSheet();toast(d.p==='1'?'Označeno jako zaplacené':'Vráceno mezi nezaplacené');break;
    case 'billSet':R.bs=JSON.parse(JSON.stringify(S.set.b));billSheet();return;
    case 'bvat':el.classList.toggle('on');R.bs.vat=el.classList.contains('on');return;
    case 'bqr':el.classList.toggle('on');R.bs.qr=el.classList.contains('on');return;
    case 'billSave':
      var acc=$('bAcc').value.trim();
      if(acc&&!toIban(acc)){$('bErr').textContent='Číslo účtu nepoznávám. Zadej 123456789/0800 nebo IBAN.';return}
      S.set.b={name:$('bName').value.trim(),address:$('bAddr').value.trim(),ico:$('bIco').value.trim(),dic:$('bDic').value.trim(),account:acc,vat:R.bs.vat,qr:R.bs.qr,dueDays:Math.max(1,Math.min(90,Math.floor(num($('bDue').value))||14)),price:Math.max(0,num($('bPrice').value)),note:$('bNote').value.trim()};
      save();closeSheet();toast('Fakturační údaje uloženy');break;
    case 'backup':backup();return;
    case 'copyBackup':
      var ta=$('bk');ta.select();try{navigator.clipboard?navigator.clipboard.writeText(ta.value):document.execCommand('copy');toast('Zkopírováno')}catch(e){document.execCommand('copy');toast('Zkopírováno')}return;
    case 'restore':restoreSheet();return;
    case 'doRestore':
      try{var j=JSON.parse($('bkText').value);if(!j||!Array.isArray(j.clients))throw 0;S=j;ensureCal();S.events=S.events||[];S.mails=S.mails||[];S.invoices=S.invoices||[];save();closeSheet();R={tab:'clients',client:null,adj:0,note:'',draft:null,bs:null,month:mStart(Date.now())};toast('Data obnovena')}
      catch(e){$('bkErr').textContent='Tohle není platná záloha.';return}
      break;
    case 'sample':sampleData();runAll();toast('Ukázková data načtena');break;
    case 'wipe':
      if(!R.wipe){R.wipe=true;toast('Klepni znovu pro smazání všech dat');setTimeout(function(){R.wipe=false},4000);return}
      R.wipe=false;S=blank();save();R.client=null;toast('Vše smazáno');break;
  }
  render();
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el)return;if(el.classList.contains('ov')&&e.target!==el)return;act(el.dataset.a,el)});
document.addEventListener('input',function(e){var t=e.target;if(t.id==='smsTxt')updSmsCount();if(t.id==='adjNote')R.note=t.value;if(t.dataset&&t.dataset.l!==undefined&&R.draft){R.draft.lines[+t.dataset.l][t.dataset.k]=t.value;updateTotal()}});
document.addEventListener('change',function(e){
  var f=e.target.dataset.f;if(!f)return;var v=e.target.value;
  if(f==='trainer'){S.set.trainer=v;save();return}
  if(f==='smsText'){S.set.sms.text=v||SMS_DEF;save();return}
  if(f==='emailOutText'){S.set.notify.emailText=v||EMAIL_OUT_DEF;save();return}
  var c=cl(R.client);if(!c)return;
  if(f==='name')c.name=v||c.name;
  else if(f==='greeting')c.greeting=v.trim();
  else if(f==='phone')c.phone=v.trim();
  else if(f==='notify'){c.notify=v;c.smsArm=bal(c)>0?true:c.smsArm}
  else if(f==='email'){var em=v.trim().toLowerCase();if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)&&!S.clients.some(function(x){return x!==c&&x.email===em}))c.email=em;else toast('E-mail je neplatný nebo už existuje.')}
  else if(f==='type')c.type=v;
  else if(f==='trackFrom'){if(v)c.trackFrom=new Date(v+'T00:00').getTime()}
  else if(f==='price')c.price=num(v);
  else if(f==='billing')c.billing=v;
  save();render();
});
document.addEventListener('visibilitychange',function(){if(!document.hidden){runAll();render();gcSync(false)}});
setInterval(function(){if(document.hidden||$('sheet').innerHTML)return;if(S.set.cal.url){gcSync(false)}else{var n=runAll();if(n)render()}},300000);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
runAll();render();window.__ready=true;
setTimeout(function(){var n=unpaidClients().length;if(n)toast('Nezaplaceno: '+n+' '+(n===1?'klient':(n<5?'klienti':'klientů'))+(unpaidTotal()?' ('+money(unpaidTotal())+')':''))},1500);
if(location.hash.indexOf('#gc=')===0){
  try{var jd=JSON.parse(gcB64(location.hash.slice(4)));var rr=gcApply(jd);save();render();toast('Kalendář načten ('+rr.total+' událostí'+(rr.n?', zapsáno tréninků: '+rr.n:'')+')')}catch(ex){toast('Data z Googlu se nepodařilo přečíst.')}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(ex){}
}
gcSync(false);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  var hadCtl=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadCtl&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
</body>
</html>
